[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bar"
version = "0.2.0"
description = "Your open AI coding agent chats in your menu bar: which need review, which are working, and their queues, repositories and messages."
readme = "README.md"
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.10"
dependencies = []
classifiers = ["License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)", "Operating System :: OS Independent"]

[project.scripts]
agent-bar = "agent_bar.__main__:main"

[tool.setuptools]
packages = ["agent_bar"]

[tool.setuptools.package-data]
agent_bar = ["data/gnome-extension/*", "data/vscode-bridge/*"]
